<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mamá Inés Restaurante | Menú del día</title>
<meta name="description" content="Menú del día de Mamá Inés Restaurante. Escoge tu plato, dinos qué quieres y qué no, y pídelo a tu mesa o a domicilio.">
<meta name="theme-color" content="#3F2024">
<link rel="icon" href="assets/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Playfair+Display:wght@800;900&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#menuBody">Saltar al menú</a>

<header class="topbar">
  <a class="brand" href="#top" aria-label="Mamá Inés Restaurante, inicio">
    <img src="assets/emblem-light.png" alt="" width="34" height="45">
    <span>Mamá Inés</span>
  </a>
  <button class="cart-btn" id="openCartTop" type="button" aria-label="Abrir mi pedido">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2l2-8H6.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></svg>
    <span class="cart-count" id="countTop" hidden>0</span>
  </button>
</header>

<main id="top">
  <article class="flyer" aria-labelledby="mdTitle">
    <img class="flyer-logo" src="assets/logo.png" alt="Mamá Inés Restaurante" width="150" height="230">
    <h1 class="md-title" id="mdTitle">Menú del día</h1>
    <p class="md-day" id="mdDay" aria-live="polite"></p>
    <nav class="daytabs" id="dayTabs" aria-label="Menú de cada día"></nav>
    <p class="banner" id="dayBanner" role="status" hidden></p>
    <div id="menuBody" class="menu-body" tabindex="-1"></div>
  </article>

  <section class="contact" aria-label="Pide tu domicilio">
    <p class="contact-script">Pide tu domicilio</p>
    <a class="contact-phone" id="contactPhone" href="#"></a>
    <p class="contact-line" id="contactAddress"></p>
    <p class="contact-line" id="contactInsta"></p>
  </section>
</main>

<div class="cartbar" id="cartbar" hidden>
  <button class="btn btn-cream cartbar-btn" id="trackBtn" type="button" hidden>
    <span class="dot" aria-hidden="true"></span>
    <span id="trackBtnText">Pedido</span>
    <strong>Ver estado</strong>
  </button>
  <button class="btn btn-wine cartbar-btn" id="openCartBar" type="button" hidden>
    <span class="cartbar-n" id="barCount">0</span>
    <span>Ver mi pedido</span>
    <strong id="barTotal">$0</strong>
  </button>
</div>

<!-- Personalizar un plato: ¿qué quieres y qué no? -->
<dialog class="sheet" id="dishDialog" aria-labelledby="dishTitle">
  <form id="dishForm" novalidate>
    <div class="sheet-head">
      <h2 id="dishTitle">Tu plato</h2>
      <button class="icon-btn" id="closeDish" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="dish-hero">
        <div class="dish-art big" id="dishArt" aria-hidden="true"></div>
        <div>
          <p class="dish-name" id="dishName"></p>
          <p class="dish-price" id="dishPrice"></p>
        </div>
      </div>
      <fieldset class="ask" id="partsField" hidden>
        <legend>¿Qué lleva tu plato?</legend>
        <p class="hint">Deja marcado lo que sí quieres. <b>Desmarca lo que NO quieres.</b></p>
        <div id="partsList" class="checks"></div>
      </fieldset>
      <fieldset class="ask" id="choiceField" hidden>
        <legend id="choiceLegend">Elige uno</legend>
        <div id="choiceList" class="checks"></div>
        <p class="err" id="choiceErr" role="alert"></p>
      </fieldset>
      <div class="field">
        <label for="dishNote">¿Algo más? <span class="opt">(opcional)</span></label>
        <input id="dishNote" type="text" maxlength="120" placeholder="Ej: sin ají, bien cocida…" autocomplete="off">
      </div>
      <div class="dish-foot">
        <div class="step" role="group" aria-label="Cantidad">
          <button type="button" id="dishMinus" aria-label="Quitar uno">−</button>
          <output id="dishQty" aria-live="polite">1</output>
          <button type="button" id="dishPlus" aria-label="Agregar uno más">+</button>
        </div>
        <button class="btn btn-wine grow" id="dishAdd" type="submit">Agregar</button>
      </div>
    </div>
  </form>
</dialog>

<!-- Mi pedido / seguimiento -->
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle">Mi pedido</h2>
    <button class="icon-btn" id="closeCart" type="button" aria-label="Cerrar mi pedido">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="sheet-body">
    <div id="emptyState" class="empty" hidden>
      <p class="empty-title">Tu pedido está vacío</p>
      <p>Escoge un plato del menú del día y vuelve aquí.</p>
      <button class="btn btn-wine" id="backToMenu" type="button">Ver el menú</button>
    </div>

    <div id="cartContent" hidden>
      <ul class="lines" id="lines"></ul>
      <div class="totalrow"><span>Total</span><strong id="sheetTotal">$0</strong></div>
      <button class="link-btn" id="clearCart" type="button">Vaciar pedido</button>

      <form id="orderForm" novalidate>
        <h3>Tus datos</h3>

        <fieldset class="seg">
          <legend>¿Dónde lo recibes?</legend>
          <label><input type="radio" name="type" value="mesa" checked><span>En mesa</span></label>
          <label><input type="radio" name="type" value="domicilio"><span>Domicilio</span></label>
        </fieldset>

        <div class="field">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required aria-describedby="nameErr">
          <p class="err" id="nameErr" role="alert"></p>
        </div>

        <div class="field" id="tableField">
          <label for="table">Número de mesa</label>
          <select id="table" name="table" aria-describedby="tableErr"></select>
          <p class="err" id="tableErr" role="alert"></p>
        </div>

        <div class="field" id="addressField" hidden>
          <label for="address">Dirección de entrega</label>
          <input id="address" name="address" type="text" autocomplete="street-address" maxlength="200" aria-describedby="addressErr" placeholder="Calle, número, barrio">
          <p class="err" id="addressErr" role="alert"></p>
        </div>

        <div class="field">
          <label for="phone">Teléfono <span class="opt" id="phoneOpt">(opcional)</span></label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="25" aria-describedby="phoneErr" placeholder="300 123 4567">
          <p class="err" id="phoneErr" role="alert"></p>
        </div>

        <div class="field">
          <label for="notes">Notas para todo el pedido <span class="opt">(opcional)</span></label>
          <textarea id="notes" name="notes" rows="2" maxlength="300" placeholder="Ej: traer los cubiertos aparte…"></textarea>
        </div>

        <button class="btn btn-wine wide" id="sendBtn" type="submit">Enviar pedido</button>
        <p class="hint" id="sendStatus" role="status"></p>
      </form>
    </div>

    <div id="trackView" hidden>
      <p class="track-code" id="trackCode"></p>
      <p class="track-msg" id="trackMsg" role="status"></p>
      <ol class="steps" id="trackSteps"></ol>
      <p class="track-where" id="trackWhere"></p>
      <p class="hint" id="trackNote"></p>
      <button class="btn btn-wine" id="newOrder" type="button" hidden>Hacer otro pedido</button>
      <button class="link-btn" id="backFromTrack" type="button">Volver al menú</button>
    </div>
  </div>
</dialog>

<div class="sr-only" id="live" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
