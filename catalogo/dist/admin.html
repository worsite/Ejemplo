<title>Panel de pedidos | Mamá Inés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Playfair+Display:wght@800;900&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root {
  --red: #68393D; --red-dark: #4B2328; --gold: #FFD668; --ink: #3F2024; --cream: #F3EFE8; --paper: #FBF8F2;
  --muted: #65504A; --green: #2F6B3A;
  --c-pendiente: #A32A2A; --c-confirmado: #1D4ED8; --c-en_cocina: #B45309; --c-listo: #15803D; --c-en_despacho: #6D28D9;
  --c-entregado: #57534E; --c-cancelado: #78716C;
  --border: 2px solid var(--ink); --shadow: 0 6px 16px rgba(63, 32, 36, .18);
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Karla', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 400 1rem/1.45 var(--font-body); color: var(--ink); background: var(--cream); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.1; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 6px var(--gold); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 18px; border: var(--border); border-radius: 999px; font-weight: 700; background: var(--paper); transition: transform .12s ease, box-shadow .12s ease; box-shadow: none; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(63, 32, 36, .25); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-red { background: var(--red); color: #fff; }
.btn-main { background: var(--gold); flex: 1; font-size: 1.05rem; min-height: 52px; }
.btn-ghost { background: var(--paper); }
.btn-danger { background: var(--red-dark); color: #fff; }

/* Login */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: var(--ink); }
.login-card { width: 100%; max-width: 380px; display: grid; gap: 14px; padding: 26px 22px; background: var(--cream); border-radius: 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, .4); }
.login-card h1 { font-size: 2.2rem; }
.field { display: grid; gap: 6px; }
label { font-weight: 700; }
input { width: 100%; min-height: 48px; padding: 10px 14px; background: var(--paper); border: var(--border); border-radius: 14px; }
.err { margin: 0; min-height: 1.2em; color: var(--red-dark); font-weight: 700; }
.err:empty { display: none; }

/* Panel */
.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--ink); color: #fff; border-bottom: var(--border); }
.top h1 { display: flex; align-items: center; gap: 10px; font-family: var(--font-body); font-weight: 800; font-size: 1.2rem; }
.top h1 img { width: 30px; height: auto; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top .btn { color: var(--ink); }
.conn { padding: 4px 12px; border-radius: 999px; background: #BBF7D0; color: #14532D; font-weight: 700; font-size: .85rem; }
.conn.off { background: #FDE68A; color: #78350F; }

.tabs { display: flex; gap: 8px; padding: 12px 16px 0; }
.tab { min-height: 44px; padding: 6px 18px; border: var(--border); border-radius: 999px; background: var(--paper); font-weight: 700; }
.tab.on { background: var(--ink); color: #fff; }
.n { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; margin-left: 4px; background: var(--gold); color: var(--ink); border-radius: 999px; font-size: .85rem; }
.tab.on .n { background: var(--gold); }
.notice { margin: 12px 16px 0; padding: 10px 14px; background: #FEE2E2; border: 2px solid var(--red-dark); border-radius: 12px; font-weight: 700; color: var(--red-dark); }
.empty-all { margin: 40px 16px; text-align: center; color: var(--muted); font-size: 1.1rem; }

.board { display: grid; gap: 22px; padding: 16px; }
.col h2 { display: flex; align-items: center; margin-bottom: 10px; font-size: 1.4rem; }
.none { margin: 0; padding: 18px; text-align: center; color: var(--muted); border: 2px dashed rgba(69, 10, 10, .3); border-radius: 14px; }

.order { position: relative; margin-bottom: 14px; padding: 14px 14px 14px 18px; background: var(--paper); border: var(--border); border-left-width: 10px; border-radius: 16px; box-shadow: var(--shadow); }
.item-detail { display: block; margin-left: 1.6em; color: var(--red); font-weight: 700; font-size: .92rem; }
.order header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.code { font-family: var(--font-display); font-size: 1.7rem; }
.where { padding: 2px 10px; border: 2px solid var(--ink); border-radius: 999px; font-weight: 700; font-size: .9rem; background: #FEF3C7; }
.where.domicilio { background: #DDD6FE; }
.age { margin-left: auto; font-weight: 700; color: var(--muted); }
.order.late .age { color: var(--red-dark); }
.order.late { animation: late 1.6s ease-in-out infinite; }
.s-pendiente { border-left-color: var(--c-pendiente); } .s-confirmado { border-left-color: var(--c-confirmado); }
.s-en_cocina { border-left-color: var(--c-en_cocina); } .s-listo { border-left-color: var(--c-listo); }
.s-en_despacho { border-left-color: var(--c-en_despacho); } .s-entregado { border-left-color: var(--c-entregado); opacity: .85; }
.s-cancelado { border-left-color: var(--c-cancelado); opacity: .75; }
.order p { margin: 6px 0 0; }
.who a { color: var(--red-dark); font-weight: 700; margin-left: 6px; }
.addr { color: var(--muted); }
.items { list-style: none; margin: 10px 0 0; padding: 10px 12px; background: var(--cream); border-radius: 10px; display: grid; gap: 2px; }
.notes { padding: 8px 12px; background: #FEF9C3; border: 2px solid #CA8A04; border-radius: 10px; font-weight: 500; }
.total { display: flex; align-items: center; justify-content: space-between; font-size: 1.25rem; }
.pill { padding: 3px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; background: var(--cream); border: 2px solid currentColor; }
.s-pendiente .pill { color: var(--c-pendiente); } .s-confirmado .pill { color: var(--c-confirmado); } .s-en_cocina .pill { color: var(--c-en_cocina); }
.s-listo .pill { color: var(--c-listo); } .s-en_despacho .pill { color: var(--c-en_despacho); } .s-entregado .pill, .s-cancelado .pill { color: var(--c-entregado); }
.actions, .confirm { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.confirm span { flex: 1 1 100%; font-weight: 700; }
.flash { animation: flash 1.4s ease-out; }

@keyframes flash { 0% { transform: scale(.96); background: #FEF08A; } 100% { transform: none; background: var(--paper); } }
@keyframes late { 50% { box-shadow: 0 0 0 4px rgba(163, 42, 42, .45); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (min-width: 700px) { .board.cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } .board.hist { max-width: 760px; } }
@media (min-width: 1200px) { .board.cols { grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; } }
code { padding: 1px 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; font-size: .9em; word-break: break-all; }

/* Editor del menú de la semana */
.menuview { padding: 16px; max-width: 920px; margin: 0 auto; }
.state { text-align: center; color: var(--muted); padding: 30px 0; }
.mdays { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.mdays button { position: relative; display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 6px 4px; background: var(--paper); border: var(--border); border-radius: 14px; font-weight: 800; }
.mdays button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tag { font-size: .7rem; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--gold); color: var(--ink); }
.tag.empty { background: #F3DADA; color: var(--red-dark); }
.mbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 6px; }
.mbar h2 { font-size: 1.6rem; }
.erow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.copy { display: grid; gap: 2px; font-size: .85rem; }
select { min-height: 44px; padding: 6px 12px; background: var(--paper); border: var(--border); border-radius: 12px; font: inherit; }
.btn.sm { min-height: 40px; padding: 4px 14px; font-size: .92rem; }
.btn-ghost, a.btn { text-decoration: none; color: var(--ink); }
.mhelp { margin: 4px 0 14px; color: var(--muted); }
.errlist { margin: 0 0 14px; padding: 12px 16px; background: #FBE4E4; border: 2px solid #A32A2A; border-radius: 12px; color: #7A1E1E; }
.errlist ul { margin: 6px 0 0; padding-left: 20px; }
.esec { margin: 0 0 18px; padding: 14px; background: var(--paper); border: var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.esec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.esec-head h3 { font-size: 1.2rem; font-family: var(--font-body); font-weight: 800; }
.egrid { display: grid; gap: 10px; grid-template-columns: 1fr; margin-bottom: 10px; align-items: start; }
.esec label, .eitem label { display: grid; align-content: start; gap: 4px; font-weight: 800; font-size: .92rem; margin-bottom: 8px; }
.opt { font-weight: 400; color: var(--muted); }
.eitems { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; gap: 10px; }
.eitem { padding: 12px; background: var(--cream); border: 1.5px solid rgba(63, 32, 36, .35); border-radius: 14px; }
.eitem-top { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; }
.eart { width: 84px; height: 66px; padding: 4px; background: #EDE5D4; border-radius: 12px; }
.eart svg { width: 100%; height: 100%; }
.eitem-fields { display: grid; }
.hint { font-weight: 600; color: var(--red); min-height: 1.1em; font-size: .85rem; }
.none { margin: 0; padding: 14px; text-align: center; color: var(--muted); }
.none.big { margin-bottom: 14px; }
.msave { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding: 12px 14px; background: var(--paper); border: var(--border); border-radius: 16px; box-shadow: 0 -6px 18px rgba(63, 32, 36, .15); }
.mstate { margin: 0; font-weight: 700; color: var(--muted); }
.mstate.dirty { color: #7A4B00; }
.mstate .ok { color: var(--green); } .mstate .err { color: #A32A2A; }
@media (min-width: 700px) { .egrid { grid-template-columns: 1fr 1fr; } }

</style>
</head>

function newId() {
  const abc = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const r = globalThis.crypto?.getRandomValues ? globalThis.crypto.getRandomValues(new Uint8Array(6)) : Array.from({ length: 6 }, () => Math.floor(Math.random() * 256));
  return Array.from(r, (n) => abc[n % abc.length]).join('');
}

const priceOf = (section, item) => item?.price ?? section?.price ?? null;

function partsOf(section, item) {
  const seen = new Set();
  const out = [];
  for (const raw of [...(section?.includes || []), ...(item?.parts || [])]) {
    const p = String(raw || '').trim();
    if (p && !seen.has(p.toLowerCase())) { seen.add(p.toLowerCase()); out.push(p); }
  }
  return out;
}

function flattenMenu(menu) {
  const out = [];
  for (const section of menu?.sections || []) {
    for (const item of section.items || []) {
      out.push({ key: `${section.id}.${item.id}`, section, item, price: priceOf(section, item), parts: partsOf(section, item) });
    }
  }
  return out;
}

const findItem = (menu, key) => flattenMenu(menu).find((f) => f.key === key) || null;

function buildDetail({ removed = [], choice = '', choiceLabel = '', note = '' } = {}) {
  const segs = [];
  if (removed.length) segs.push(removed.map((p) => `sin ${String(p).toLowerCase()}`).join(', ').replace(/^s/, 'S'));
  if (choice) segs.push(`${choiceLabel || 'Opción'}: ${choice}`);
  if (String(note).trim()) segs.push(String(note).trim());
  return segs.join(' · ').slice(0, MAX_DETAIL);
}

function validateMenu(menu) {
  const errs = [];
  if (!menu || !Array.isArray(menu.sections)) return ['El menú no es válido.'];
  if (menu.sections.length > MAX_SECTIONS) errs.push(`Máximo ${MAX_SECTIONS} secciones por menú.`);
  const secIds = new Set();
  for (const s of menu.sections) {
    const label = String(s.title || '').trim() || '(sin título)';
    if (!String(s.title || '').trim()) errs.push('Una sección no tiene título.');
    if (secIds.has(s.id)) errs.push(`La sección "${label}" tiene un código repetido.`);
    secIds.add(s.id);
    if (s.price != null && !isPrice(s.price)) errs.push(`El precio de la sección "${label}" no es válido.`);
    const items = s.items || [];
    if (items.length > MAX_ITEMS) errs.push(`La sección "${label}" tiene más de ${MAX_ITEMS} platos.`);
    const itemIds = new Set();
    for (const it of items) {
      const name = String(it.name || '').trim();
      if (!name) errs.push(`Hay un plato sin nombre en "${label}".`);
      if (itemIds.has(it.id)) errs.push(`"${name || label}" tiene un código repetido.`);
      itemIds.add(it.id);
      if (it.price != null && !isPrice(it.price)) errs.push(`El precio de "${name}" no es válido.`);
      else if (name && priceOf(s, it) == null) errs.push(`"${name}" no tiene precio (ponle uno o ponle precio a la sección).`);
    }
  }
  return errs;
}

/* ---------- Ayudas del editor del panel ---------- */
const parseList = (s) => String(s ?? '').split(',').map((x) => x.trim()).filter(Boolean);

function parsePrice(s) {
  const n = Number(String(s ?? '').replace(/\D/g, ''));
  return Number.isInteger(n) && n > 0 ? n : null;
}

function moveItem(arr, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= arr.length || i < 0 || i >= arr.length) return arr;
  const out = [...arr];
  [out[i], out[j]] = [out[j], out[i]];
  return out;
}

const cloneMenu = (menu) => (menu && Array.isArray(menu.sections) ? JSON.parse(JSON.stringify(menu)) : emptyMenu());
const blankItem = () => ({ id: newId(), name: '', art: 'plato' });
const blankSection = () => ({ id: newId(), title: '', price: null, items: [] });

// Deja el menú listo para guardar: recorta textos, quita campos vacíos y normaliza los precios.
function normalizeMenu(menu) {
  const txt = (v) => String(v ?? '').trim();
  const list = (a) => (Array.isArray(a) ? a.map(txt).filter(Boolean) : []);
  return {
    sections: (menu?.sections || []).map((s) => {
      const out = { id: s.id, title: txt(s.title) };
      if (txt(s.note)) out.note = txt(s.note);
      const price = parsePrice(s.price);
      if (price) out.price = price;
      if (list(s.includes).length) out.includes = list(s.includes);
      out.items = (s.items || []).map((it) => {
        const o = { id: it.id, name: txt(it.name) };
        if (txt(it.desc)) o.desc = txt(it.desc);
        const p = parsePrice(it.price);
        if (p) o.price = p;
        if (list(it.parts).length) o.parts = list(it.parts);
        if (list(it.choices).length) {
          o.choices = list(it.choices);
          if (txt(it.choiceLabel)) o.choiceLabel = txt(it.choiceLabel);
        }
        o.art = txt(it.art) || 'plato';
        return o;
      });
      return out;
    }),
  };
}

const BOWLS = new Set(['sancocho', 'sopa_maiz', 'frijoles', 'sopa']);

function artSvg(key) {
  const k = ART[key] ? key : 'plato';
  const svg = ART[k]();
  if (PLATES.has(k)) return svg.replace('viewBox="0 0 200 200"', 'viewBox="0 62 200 128"');

}

// ---- cart.js ----
// Carrito por líneas: cada línea es un plato + su detalle ("sin arroz · Sabor: coco") + cantidad.
// Solo se guarda qué plato (itemKey) y cuántos; nombre y precio salen siempre del menú vigente.

const STORAGE_KEY = 'mamaines-cart-v1';
const MAX_QTY = 50;

function formatCOP(n) {
  return '$' + Math.round(n).toLocaleString('es-CO', { useGrouping: true, maximumFractionDigits: 0 })
    .replace(/[\s,]/g, '.');
}

const lineKey = (itemKey, detail) => `${itemKey}|${detail}`;

function addLine(cart, { itemKey, detail = '', qty = 1 }) {
  if (!Number.isInteger(qty) || qty <= 0) return cart;
  const key = lineKey(itemKey, detail);
  const i = cart.findIndex((l) => l.key === key);
  if (i === -1) return [...cart, { key, itemKey, detail, qty: Math.min(qty, MAX_QTY) }];
  return cart.map((l, j) => (j === i ? { ...l, qty: Math.min(l.qty + qty, MAX_QTY) } : l));
}

function setQty(cart, key, qty) {
  if (!Number.isFinite(qty) || qty <= 0) return cart.filter((l) => l.key !== key);
  return cart.map((l) => (l.key === key ? { ...l, qty: Math.min(Math.floor(qty), MAX_QTY) } : l));
}

const clear = () => [];

function resolve(cart, menu) {
  const byKey = new Map(flattenMenu(menu).map((f) => [f.key, f]));
  const out = [];
  for (const l of cart) {
    const f = byKey.get(l.itemKey);
    if (!f || f.price == null) continue;
    out.push({ ...l, name: f.item.name, price: f.price, subtotal: f.price * l.qty, art: f.item.art });
  }
  return out;
}

const total = (cart, menu) => resolve(cart, menu).reduce((s, l) => s + l.subtotal, 0);
const count = (cart) => cart.reduce((s, l) => s + l.qty, 0);

function load(storage) {
  try {
    const raw = JSON.parse(storage.getItem(STORAGE_KEY));
    if (!Array.isArray(raw)) return [];
    const out = [];
    for (const l of raw) {
      if (!l || typeof l.itemKey !== 'string' || !Number.isInteger(l.qty) || l.qty <= 0) continue;
      const detail = typeof l.detail === 'string' ? l.detail.slice(0, MAX_DETAIL) : '';
      out.push({ key: lineKey(l.itemKey, detail), itemKey: l.itemKey, detail, qty: Math.min(l.qty, MAX_QTY) });
    }
    return out;
  } catch { return []; }
}

function save(storage, cart) {
  try { storage.setItem(STORAGE_KEY, JSON.stringify(cart.map(({ itemKey, detail, qty }) => ({ itemKey, detail, qty })))); } catch { /* storage bloqueado o lleno */ }
}

// ---- orders.js ----
// Lógica pura de pedidos: estados, validación y armado del RPC. Sin DOM ni red.
const STATUS = {
  pendiente: { label: 'Pendiente', customer: 'Recibimos tu pedido. Estamos esperando que el local lo confirme.' },
  confirmado: { label: 'Confirmado', customer: '¡Pedido confirmado! En breve empezamos a prepararlo.' },
  en_cocina: { label: 'En cocina', customer: 'Estamos preparando tu pedido.' },
  listo: { label: 'Listo', customer: '¡Tu pedido está listo!' },
  en_despacho: { label: 'En despacho', customer: 'Tu pedido va en camino.' },
  entregado: { label: 'Entregado', customer: '¡Buen provecho! Gracias por pedir con nosotros.' },
  cancelado: { label: 'Cancelado', customer: 'Tu pedido fue cancelado. Escríbenos si tienes dudas.' },
};

const NEXT_LABEL = {
  confirmado: 'Confirmar pedido', en_cocina: 'Pasar a cocina', listo: 'Marcar listo',
  en_despacho: 'Despachar', entregado: 'Marcar entregado',
};

function flow(type) {
  return type === 'domicilio'
    ? ['pendiente', 'confirmado', 'en_cocina', 'en_despacho', 'entregado']
    : ['pendiente', 'confirmado', 'en_cocina', 'listo', 'entregado'];
}

function nextStatus(status, type) {
  const f = flow(type);
  const i = f.indexOf(status);
  return i === -1 || i === f.length - 1 ? null : f[i + 1];
}

const nextLabel = (status) => NEXT_LABEL[status] || '';
const isActive = (status) => status !== 'entregado' && status !== 'cancelado';

function customerMessage(status, type) {
  if (status === 'listo' && type === 'mesa') return '¡Tu pedido está listo y va para tu mesa!';
  return (STATUS[status] || STATUS.pendiente).customer;
}

function progress(status, type) {
  const f = flow(type);
  const cur = f.indexOf(status);
  return {
    cancelled: status === 'cancelado',
    steps: f.map((id, i) => ({
      id, label: STATUS[id].label,
      state: status === 'cancelado' ? 'todo' : i < cur ? 'done' : i === cur ? 'current' : 'todo',
    })),
  };
}

const digits = (s) => String(s || '').replace(/\D/g, '');

function validateOrderForm(form, { tables }) {
  const e = {};
  if (!String(form.name || '').trim()) e.name = 'Escribe tu nombre para el pedido.';
  if (form.type !== 'mesa' && form.type !== 'domicilio') {
    e.type = 'Elige si es para mesa o domicilio.';
    return e;
  }
  const phone = String(form.phone || '').trim();
  if (form.type === 'mesa') {
    const t = Number(form.table);
    if (!Number.isInteger(t) || t < 1 || t > tables) e.table = `Elige tu mesa (1 a ${tables}).`;
    if (phone && digits(phone).length < 7) e.phone = 'Revisa el teléfono: parece incompleto.';
  } else {
    if (String(form.address || '').trim().length < 5) e.address = 'Escribe la dirección de entrega.';
    if (digits(phone).length < 7) e.phone = 'Escribe un teléfono para contactarte.';
  }
  return e;
}

// El cliente NO manda precios ni nombres: solo qué plato, cuántos y el detalle. El servidor los busca en el menú de hoy.
function buildCreateOrderArgs({ resolved, total, customer }) {
  const dom = customer.type === 'domicilio';
  const phone = String(customer.phone || '').trim();
  return {
    p_name: String(customer.name).trim(),
    p_phone: phone || null,
    p_type: customer.type,
    p_table: dom ? null : Number(customer.table),
    p_address: dom ? String(customer.address).trim() : null,
    p_notes: String(customer.notes || '').trim().slice(0, 300) || null,
    p_items: resolved.map((l) => ({ id: l.itemKey, qty: l.qty, detail: l.detail || '' })),
    p_total: total,
  };
}

function minutesAgo(iso, nowMs) {
  return Math.max(0, Math.floor((nowMs - Date.parse(iso)) / 60000));
}

function elapsedLabel(min) {
  if (min < 1) return 'ahora';
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `hace ${h} h ${m} min` : `hace ${h} h`;
}

// Un pedido "se atrasa" si lleva ≥3 min sin confirmar, o ≥20 min en cualquier otro estado activo.
function isLate(status, min) {
  if (!isActive(status)) return false;
  return min >= (status === 'pendiente' ? 3 : 20);
}

// ---- util.js ----
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- supabase.js ----
// Cliente mínimo de Supabase: solo llamadas a funciones (RPC) con la clave pública "anon".
function createSupabase({ url, key, fetch: fetchFn = (...a) => globalThis.fetch(...a) }) {
  return {
    async rpc(name, args) {
      const res = await fetchFn(`${url}/rest/v1/rpc/${name}`, {
        method: 'POST',
        headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(args ?? {}),
      });
      const text = await res.text();
      let data = null;
      if (text) { try { data = JSON.parse(text); } catch { data = text; } }
      if (!res.ok) {
        const msg = (data && (data.message || data.error_description || data.msg || data.error)) || `Error ${res.status}`;
        throw Object.assign(new Error(msg), { status: res.status });
      }
      return data;
    },
  };
}

// ---- menu-editor.js ----
// Editor del menú de la semana (panel de administración): un menú por día, con secciones y platos.

function createMenuEditor({ root, rpc, getKey, onForbidden }) {
  let menus = {};
  let today = new Date().getDay();
  let day = null;
  let draft = emptyMenu();
  let dirty = false;
  let saving = false;
  let loaded = false;
  let message = '';        // aviso verde / rojo
  let messageKind = 'ok';
  let errors = [];         // problemas de validación antes de guardar

  const count = (m) => flattenMenu(m).length;
  const priceHint = (v) => (v ? `= ${formatCOP(v)}` : '');
  const val = (v) => (v == null ? '' : esc(v));

  /* ---------- Datos ---------- */
  async function refresh() {
    try {
      const r = await rpc('get_daily_menus');
      menus = r?.menus || {};
      if (Number.isInteger(r?.today)) today = r.today;
      loaded = true;
      if (day === null) day = today;
      if (!dirty) draft = cloneMenu(menus[String(day)]);
    } catch {
      message = 'No pudimos cargar los menús. Revisa la conexión.'; messageKind = 'err';
    }
    render();
  }

  function setDay(d) {
    if (dirty && !window.confirm('Tienes cambios sin guardar en este día. ¿Descartarlos?')) return;
    day = d; draft = cloneMenu(menus[String(d)]); dirty = false; errors = []; message = ''; render();
  }

  async function save() {
    if (saving) return;
    const menu = normalizeMenu(draft);
    errors = validateMenu(menu);
    message = '';
    if (errors.length) { render(); root.querySelector('.errlist')?.focus(); return; }
    saving = true; render();
    try {
      await rpc('admin_save_menu', { p_key: getKey(), p_day: day, p_menu: menu });
      menus[String(day)] = menu;
      draft = cloneMenu(menu);
      dirty = false;
      message = `Guardado. ${DAYS[day]} ya se ve así en el catálogo.`; messageKind = 'ok';
    } catch (e) {
      if (e.status === 403) { saving = false; onForbidden(); return; }
      message = `No se pudo guardar: ${e.message}`; messageKind = 'err';
    }
    saving = false; render();
  }

  /* ---------- Vista ---------- */
  function itemHtml(it, si, ii, n) {
    const p = `data-s="${si}" data-i="${ii}"`;
    return `<li class="eitem">
      <div class="eitem-top">
        <div class="eart" data-art-prev="${si}.${ii}" aria-hidden="true">${artSvg(it.art)}</div>
        <div class="eitem-fields">
          <label>Nombre del plato<input type="text" ${p} data-f="name" value="${val(it.name)}" maxlength="80" placeholder="Ej: Gallina guisada"></label>
          <label>Descripción <span class="opt">(opcional)</span><input type="text" ${p} data-f="desc" value="${val(it.desc)}" maxlength="200" placeholder="Ej: arroz, ensalada, maduro y jugo"></label>
        </div>
      </div>
      <div class="egrid">
        <label>Precio propio <span class="opt">(vacío = el de la sección)</span>
          <input type="text" inputmode="numeric" ${p} data-f="price" data-hint value="${val(it.price)}" placeholder="Ej: 8000"><span class="hint" data-hintfor>${priceHint(it.price)}</span></label>
        <label>Imagen
          <select ${p} data-f="art">${ART_OPTIONS.map((o) => `<option value="${o.key}"${o.key === (it.art || 'plato') ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select></label>
      </div>
      <label>Qué lleva <span class="opt">(separado por comas; el cliente puede quitar lo que no quiera)</span>
        <input type="text" ${p} data-f="parts" value="${val((it.parts || []).join(', '))}" placeholder="Ej: Arroz, Ensalada, Maduro, Jugo"></label>
      <div class="egrid">
        <label>Elegir uno de <span class="opt">(opcional, separado por comas)</span>
          <input type="text" ${p} data-f="choices" value="${val((it.choices || []).join(', '))}" placeholder="Ej: Coco, Cereza, Hierbabuena"></label>
        <label>Pregunta de la elección
          <input type="text" ${p} data-f="choiceLabel" value="${val(it.choiceLabel)}" maxlength="40" placeholder="Ej: Sabor"></label>
      </div>
      <div class="erow">
        <button type="button" class="btn btn-ghost sm" data-act="item-up" ${p} ${ii === 0 ? 'disabled' : ''} aria-label="Subir plato">↑ Subir</button>
        <button type="button" class="btn btn-ghost sm" data-act="item-down" ${p} ${ii === n - 1 ? 'disabled' : ''} aria-label="Bajar plato">↓ Bajar</button>
        <button type="button" class="btn btn-danger sm" data-act="item-del" ${p}>Quitar plato</button>
      </div>
    </li>`;
  }

  function sectionHtml(s, si, total) {
    const p = `data-s="${si}"`;
    const items = s.items || [];
    return `<section class="esec" aria-label="Sección ${si + 1}">
      <div class="esec-head">
        <h3>Sección ${si + 1}</h3>
        <div class="erow">
          <button type="button" class="btn btn-ghost sm" data-act="sec-up" ${p} ${si === 0 ? 'disabled' : ''} aria-label="Subir sección">↑</button>
          <button type="button" class="btn btn-ghost sm" data-act="sec-down" ${p} ${si === total - 1 ? 'disabled' : ''} aria-label="Bajar sección">↓</button>
          <button type="button" class="btn btn-danger sm" data-act="sec-del" ${p}>Quitar sección</button>
        </div>
      </div>
      <div class="egrid">
        <label>Título<input type="text" ${p} data-f="title" value="${val(s.title)}" maxlength="80" placeholder="Ej: Sancocho de gallina"></label>
        <label>Precio de la sección <span class="opt">(la estrella; vale para todos sus platos)</span>
          <input type="text" inputmode="numeric" ${p} data-f="price" data-hint value="${val(s.price)}" placeholder="Ej: 25000"><span class="hint" data-hintfor>${priceHint(s.price)}</span></label>
      </div>
      <div class="egrid">
        <label>Nota <span class="opt">(opcional)</span><input type="text" ${p} data-f="note" value="${val(s.note)}" maxlength="120" placeholder="Ej: (Para todos nuestros platos)"></label>
        <label>Incluye en todos sus platos <span class="opt">(por comas)</span><input type="text" ${p} data-f="includes" value="${val((s.includes || []).join(', '))}" placeholder="Ej: Sancocho de gallina"></label>
      </div>
      <ul class="eitems">${items.map((it, ii) => itemHtml(it, si, ii, items.length)).join('') || '<li class="none">Esta sección todavía no tiene platos.</li>'}</ul>
      <button type="button" class="btn btn-ghost" data-act="item-add" ${p} ${items.length >= MAX_ITEMS ? 'disabled' : ''}>+ Agregar plato</button>
    </section>`;
  }

  function render() {
    if (!loaded) { root.innerHTML = '<p class="state">Cargando los menús…</p>'; return; }
    const others = DAYS.map((d, i) => ({ d, i, n: count(menus[String(i)]) })).filter((x) => x.i !== day);
    root.innerHTML = `
      <div class="mdays" role="group" aria-label="Día del menú">
        ${DAYS.map((d, i) => `<button type="button" data-act="day" data-day="${i}" aria-pressed="${i === day}"${i === today ? ' class="is-today"' : ''}>${d}${i === today ? '<span class="tag">hoy</span>' : ''}${count(menus[String(i)]) === 0 ? '<span class="tag empty">sin menú</span>' : ''}</button>`).join('')}
      </div>
      <div class="mbar">
        <h2>Menú del ${esc(DAYS[day])}${day === today ? ' (hoy)' : ''}</h2>
        <div class="erow">
          <label class="copy">Copiar desde
            <select id="copyFrom">${others.map((x) => `<option value="${x.i}">${x.d}${x.n ? '' : ' (vacío)'}</option>`).join('')}</select></label>
          <button type="button" class="btn btn-ghost" data-act="copy">Copiar aquí</button>
          <button type="button" class="btn btn-ghost" data-act="clear">Vaciar día</button>
          <a class="btn btn-ghost" href="catalogo.html" target="_blank" rel="noopener">Ver el catálogo</a>
        </div>
      </div>
      <p class="mhelp">El cliente solo puede pedir el menú de <b>hoy</b>; los otros días los puede ver. Cada plato necesita un precio (propio o el de su sección).</p>
      ${errors.length ? `<div class="errlist" role="alert" tabindex="-1"><b>Revisa esto antes de guardar:</b><ul>${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
      ${draft.sections.map((s, si) => sectionHtml(s, si, draft.sections.length)).join('') || '<p class="none big">Este día no tiene menú. Agrega una sección para empezar (por ejemplo, "Sancocho de gallina" o "Carnes").</p>'}
      <button type="button" class="btn btn-ghost" data-act="sec-add" ${draft.sections.length >= MAX_SECTIONS ? 'disabled' : ''}>+ Agregar sección</button>
      <div class="msave">
        <p class="mstate ${dirty ? 'dirty' : ''}" role="status">${message ? `<span class="${messageKind}">${esc(message)}</span>` : dirty ? 'Tienes cambios sin guardar.' : 'Sin cambios.'}</p>
        <button type="button" class="btn btn-main" data-act="save" ${saving || !dirty ? 'disabled' : ''}>${saving ? 'Guardando…' : 'Guardar menú'}</button>
      </div>`;
  }

  /* ---------- Edición ---------- */
  const mark = () => { dirty = true; message = ''; };

  root.addEventListener('input', (e) => {
    const el = e.target.closest('[data-f]');
    if (!el) return;
    const s = draft.sections[Number(el.dataset.s)];
    const target = el.dataset.i !== undefined ? s.items[Number(el.dataset.i)] : s;
    const f = el.dataset.f;
    if (f === 'price') {
      target.price = parsePrice(el.value);
      const hint = el.parentElement.querySelector('[data-hintfor]');
      if (hint) hint.textContent = priceHint(target.price);
    } else if (['parts', 'choices', 'includes'].includes(f)) target[f] = parseList(el.value);
    else target[f] = el.value;
    mark();
    const saveBtn = root.querySelector('[data-act="save"]');
    if (saveBtn) saveBtn.disabled = saving;
    const st = root.querySelector('.mstate');
    if (st) { st.className = 'mstate dirty'; st.textContent = 'Tienes cambios sin guardar.'; }
  });

  root.addEventListener('change', (e) => {
    if (e.target.matches('select[data-f="art"]')) {
      const s = draft.sections[Number(e.target.dataset.s)], it = s.items[Number(e.target.dataset.i)];
      it.art = e.target.value;
      root.querySelector(`[data-art-prev="${e.target.dataset.s}.${e.target.dataset.i}"]`).innerHTML = artSvg(it.art);
      mark();
      const saveBtn = root.querySelector('[data-act="save"]'); if (saveBtn) saveBtn.disabled = saving;
      const st = root.querySelector('.mstate'); if (st) { st.className = 'mstate dirty'; st.textContent = 'Tienes cambios sin guardar.'; }
    }
  });

  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const si = Number(b.dataset.s), ii = Number(b.dataset.i);
    switch (b.dataset.act) {
      case 'day': if (Number(b.dataset.day) !== day) setDay(Number(b.dataset.day)); return;
      case 'save': save(); return;
      case 'copy': {
        const from = Number(root.querySelector('#copyFrom').value);
        if (count(draft) && !window.confirm(`Esto reemplaza el menú del ${DAYS[day]} con el del ${DAYS[from]}. ¿Seguir?`)) return;
        draft = cloneMenu(menus[String(from)]); mark(); errors = []; break;
      }
      case 'clear':
        if (draft.sections.length && !window.confirm(`¿Vaciar el menú del ${DAYS[day]}? (Se aplica cuando guardes.)`)) return;
        draft = emptyMenu(); mark(); errors = []; break;
      case 'sec-add': draft.sections.push(blankSection()); mark(); break;
      case 'sec-del':
        if (!window.confirm(`¿Quitar la sección "${draft.sections[si].title || si + 1}" y sus platos?`)) return;
        draft.sections.splice(si, 1); mark(); break;
      case 'sec-up': draft.sections = moveItem(draft.sections, si, -1); mark(); break;
      case 'sec-down': draft.sections = moveItem(draft.sections, si, 1); mark(); break;
      case 'item-add': draft.sections[si].items = [...(draft.sections[si].items || []), blankItem()]; mark(); break;
      case 'item-del': draft.sections[si].items.splice(ii, 1); mark(); break;
      case 'item-up': draft.sections[si].items = moveItem(draft.sections[si].items, ii, -1); mark(); break;
      case 'item-down': draft.sections[si].items = moveItem(draft.sections[si].items, ii, 1); mark(); break;
      default: return;
    }
    render();
    // devuelve el foco al campo recién creado, si lo hay
    if (b.dataset.act === 'item-add') {
      const inputs = root.querySelectorAll(`.esec:nth-of-type(${si + 1}) .eitem [data-f="name"]`);
      inputs[inputs.length - 1]?.focus();
    }
    if (b.dataset.act === 'sec-add') root.querySelectorAll('.esec [data-f="title"]')[draft.sections.length - 1]?.focus();
  });

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  return {
    show: () => { if (!dirty) { loaded = false; render(); refresh(); } else render(); },
    isDirty: () => dirty,
  };
}

// ---- admin.js ----

const POLL_MS = 5000;
const store = (() => { try { return window.localStorage; } catch { return null; } })();
const sb = createSupabase({ url: SUPABASE_URL, key: SUPABASE_ANON_KEY });
const adminKey = ADMIN_KEY;   // acceso directo: la clave viene en config.js

const COLUMNS = [
  { id: 'pendiente', title: 'Nuevos', statuses: ['pendiente'] },
  { id: 'confirmado', title: 'Confirmados', statuses: ['confirmado'] },
  { id: 'en_cocina', title: 'En cocina', statuses: ['en_cocina'] },
  { id: 'salida', title: 'Listos y en despacho', statuses: ['listo', 'en_despacho'] },
];

let orders = [];
let known = null;               // ids ya vistos; null = aún no cargó la primera vez
let view = 'activos';
let confirmCancel = null;       // id del pedido que espera confirmación de cancelación
let busy = new Set();           // ids con un cambio de estado en curso
let lastSig = '';
let timer = null;
let soundOn = (() => { try { return store?.getItem('mamaines-sound') !== 'off'; } catch { return true; } })();
let audio = null;
let flashIds = new Set();

/* ---------- Sonido ---------- */
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch { audio = null; }
}
function beep() {
  if (!soundOn || !audio) return;
  try {
    [[880, 0], [660, 0.18]].forEach(([freq, at]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, audio.currentTime + at);
      g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + at + 0.16);
      o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + at); o.stop(audio.currentTime + at + 0.17);
    });
  } catch { /* sin audio */ }
}
function renderSound() {
  $('soundBtn').textContent = `Sonido: ${soundOn ? 'sí' : 'no'}`;
  $('soundBtn').setAttribute('aria-pressed', String(soundOn));
}

/* ---------- Pantallas ---------- */
function showLocked(msg = '') {
  clearInterval(timer); timer = null;
  $('panel').hidden = true;
  $('locked').hidden = false;
  $('lockedErr').textContent = msg;
  document.title = 'Panel de pedidos | ' + BUSINESS.name;
}
const KEY_REJECTED = 'La clave del panel no es válida. Revisa que ADMIN_KEY en config.js coincida con la que registraste en Supabase (schema.sql, paso 6).';
function showPanel() {
  $('locked').hidden = true;
  $('panel').hidden = false;
  $('panelTitle').querySelector('span').textContent = `Pedidos · ${BUSINESS.name}`;
  renderSound();
  known = null; lastSig = ''; orders = [];
  poll();
  clearInterval(timer);
  timer = setInterval(poll, POLL_MS);
}
function notice(msg) {
  $('notice').textContent = msg || '';
  $('notice').hidden = !msg;
}
function setConn(ok) {
  $('conn').textContent = ok ? 'En vivo' : 'Sin conexión…';
  $('conn').classList.toggle('off', !ok);
}

/* ---------- Datos ---------- */
async function poll() {
  try {
    const rows = await sb.rpc('admin_list_orders', { p_key: adminKey });
    setConn(true);
    notice('');
    apply(Array.isArray(rows) ? rows : []);
  } catch (e) {
    if (e.status === 403) { showLocked(KEY_REJECTED); return; }
    setConn(false);
  }
}

function apply(rows) {
  const fresh = rows.filter((o) => o.status === 'pendiente' && known && !known.has(o.id));
  orders = rows;
  if (fresh.length) {
    beep();
    flashIds = new Set(fresh.map((o) => o.id));
    $('live').textContent = fresh.length === 1 ? `Nuevo pedido #${fresh[0].code}` : `${fresh.length} pedidos nuevos`;
  }
  known = new Set(rows.map((o) => o.id));
  render();
}

async function setStatus(id, status) {
  if (busy.has(id)) return;
  busy.add(id); confirmCancel = null; render();
  try {
    const row = await sb.rpc('admin_set_status', { p_key: adminKey, p_id: id, p_status: status });
    if (!row || !row.id) throw new Error('respuesta inválida');
    orders = orders.map((o) => (o.id === id ? { ...o, ...row } : o));
    notice('');
  } catch (e) {
    if (e.status === 403) { busy.delete(id); showLocked(KEY_REJECTED); return; }
    notice('No se pudo cambiar el estado del pedido. Revisa la conexión e inténtalo de nuevo.');
  } finally { busy.delete(id); }
  render();
}

/* ---------- Render ---------- */
function itemsHtml(o) {
  return (Array.isArray(o.items) ? o.items : []).map((i) =>
    `<li><b>${esc(i.qty)}×</b> ${esc(i.name)}${i.detail ? `<span class="item-detail">${esc(i.detail)}</span>` : ''}</li>`).join('');
}

function cardHtml(o, now) {
  const min = minutesAgo(o.created_at, now);
  const next = nextStatus(o.status, o.order_type);
  const active = isActive(o.status);
  const where = o.order_type === 'mesa' ? `Mesa ${esc(o.table_number)}` : 'Domicilio';
  const late = isLate(o.status, min);
  const working = busy.has(o.id);
  const phone = o.customer_phone ? `<a href="tel:${esc(String(o.customer_phone).replace(/[^\d+]/g, ''))}">${esc(o.customer_phone)}</a>` : '';
  let actions = '';
  if (active && confirmCancel === o.id) {
    actions = `<div class="confirm"><span>¿Cancelar el pedido #${esc(o.code)}?</span>
      <button type="button" class="btn btn-danger" data-act="cancel-yes" data-id="${esc(o.id)}">Sí, cancelar</button>
      <button type="button" class="btn btn-ghost" data-act="cancel-no" data-id="${esc(o.id)}">No</button></div>`;
  } else if (active) {
    actions = `<div class="actions">
      ${next ? `<button type="button" class="btn btn-main" data-act="next" data-id="${esc(o.id)}" data-to="${next}" ${working ? 'disabled' : ''}>${working ? 'Guardando…' : esc(nextLabel(next))}</button>` : ''}
      <button type="button" class="btn btn-ghost" data-act="cancel" data-id="${esc(o.id)}" ${working ? 'disabled' : ''}>Cancelar</button></div>`;
  }
  return `<article class="order s-${o.status}${late ? ' late' : ''}${flashIds.has(o.id) ? ' flash' : ''}" data-order="${esc(o.id)}" aria-label="Pedido ${esc(o.code)}">
    <header>
      <span class="code">#${esc(o.code)}</span>
      <span class="where ${o.order_type}">${where}</span>
      <span class="age">${esc(elapsedLabel(min))}</span>
    </header>
    <p class="who"><b>${esc(o.customer_name)}</b> ${phone}</p>
    ${o.address ? `<p class="addr">${esc(o.address)}</p>` : ''}
    <ul class="items">${itemsHtml(o)}</ul>
    ${o.notes ? `<p class="notes"><b>Notas:</b> ${esc(o.notes)}</p>` : ''}
    <p class="total"><span class="pill">${esc(STATUS[o.status]?.label || o.status)}</span><b>${formatCOP(o.total)}</b></p>
    ${actions}
  </article>`;
}

function render(force = false) {
  const now = Date.now();
  const list = orders.filter((o) => (view === 'activos' ? isActive(o.status) : !isActive(o.status)));
  const pend = orders.filter((o) => o.status === 'pendiente').length;
  const nActive = orders.filter((o) => isActive(o.status)).length;
  const sig = JSON.stringify([view, confirmCancel, [...busy], [...flashIds], list.map((o) => [o.id, o.status]), Math.floor(now / 60000)]);
  $('nActivos').textContent = nActive;
  document.title = (pend ? `(${pend}) ` : '') + 'Panel de pedidos | ' + BUSINESS.name;
  if (view === 'menu') return;                 // mientras se edita el menú no se redibuja el tablero
  if (!force && sig === lastSig) return;
  lastSig = sig;

  const board = $('board');
  board.className = 'board ' + (view === 'activos' ? 'cols' : 'hist');
  if (view === 'activos') {
    board.innerHTML = COLUMNS.map((c) => {
      const items = list.filter((o) => c.statuses.includes(o.status)).sort((a, b) => a.created_at.localeCompare(b.created_at));
      return `<section class="col col-${c.id}" aria-label="${esc(c.title)}">
        <h2>${esc(c.title)} <span class="n">${items.length}</span></h2>
        ${items.map((o) => cardHtml(o, now)).join('') || '<p class="none">Nada por aquí</p>'}
      </section>`;
    }).join('');
  } else {
    board.innerHTML = `<section class="col" aria-label="Historial"><h2>Entregados y cancelados <span class="n">${list.length}</span></h2>
      ${list.slice(0, 60).map((o) => cardHtml(o, now)).join('') || '<p class="none">Aún no hay pedidos cerrados</p>'}</section>`;
  }
  $('emptyAll').hidden = orders.length > 0 || view === 'menu';
  flashIds = new Set();
}

/* ---------- Eventos ---------- */
$('board').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'next': setStatus(id, b.dataset.to); break;
    case 'cancel': confirmCancel = id; render(true); break;
    case 'cancel-no': confirmCancel = null; render(true); break;
    case 'cancel-yes': setStatus(id, 'cancelado'); break;
  }
});

const menuEditor = createMenuEditor({
  root: $('menuView'),
  rpc: (name, args) => sb.rpc(name, args),
  getKey: () => adminKey,
  onForbidden: () => showLocked(KEY_REJECTED),
});

document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  view = t.dataset.view;
  document.querySelectorAll('.tab').forEach((x) => { x.classList.toggle('on', x === t); x.setAttribute('aria-pressed', String(x === t)); });
  const isMenu = view === 'menu';
  $('menuView').hidden = !isMenu;
  $('board').hidden = isMenu;
  if (isMenu) { $('emptyAll').hidden = true; menuEditor.show(); } else render(true);
}));

$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  try { store?.setItem('mamaines-sound', soundOn ? 'on' : 'off'); } catch { /* sin storage */ }
  unlockAudio(); renderSound(); if (soundOn) beep();
});

if (adminKey) showPanel(); else showLocked(KEY_REJECTED);

</script>
</body>
</html>
